# Netlify: React frontend + Express API (as a Netlify Function) on one site.
# Set MONGO_URI, JWT_SECRET (and optionally GEMINI_API_KEY, GOOGLE_CLIENT_ID)
# in Netlify → Site configuration → Environment variables.

[build]
  command = "npm ci --prefix server --omit=dev && npm ci --prefix client && npm run build --prefix client"
  publish = "client/dist"
  functions = "server/functions"

[build.environment]
  NODE_VERSION = "20"

# The API runs on the same site, so the frontend calls /api/... directly
[context.production.environment]
  VITE_API_URL = "/"

[context.deploy-preview.environment]
  VITE_API_URL = "/"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# Single-page app: every other path loads index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
